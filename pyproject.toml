[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchart-benchmark"
version = "0.1.0"
description = "Multimodal benchmarks for flowchart image evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10,<12",
    "openai>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
space = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lpips>=0.1.4",
    "easyocr>=1.7",
]
dev = [
    "pytest>=8",
]

[tool.setuptools]
py-modules = ["pipeline", "llm", "schemas", "utils", "config"]
