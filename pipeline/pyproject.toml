[project]
name = "flowchart-pipeline"
version = "0.1.0"
description = "Flowchart generation pipeline"
readme = "README copy.md"
requires-python = "==3.12.*"
dependencies = [
    "einops>=0.8",
    "google-genai>=1.0",
    "numpy>=1.26,<3",
    "openai>=1.0",
    "pillow>=10",
    "pycocotools>=2.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "setuptools<81",
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
