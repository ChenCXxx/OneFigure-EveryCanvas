[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchart-benchmark"
version = "0.1.0"
description = "Multimodal benchmarks for flowchart image evaluation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26,<2",
    "Pillow>=10,<12",
    "openai>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
space = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lpips>=0.1.4",
    "easyocr>=1.7",
]
dev = [
    "pytest>=8",
]

[tool.setuptools]
py-modules = ["pipeline", "llm", "schemas", "utils", "config"]

[tool.setuptools.packages.find]
include = ["benchmarks*"]
exclude = ["inputs*", "outputs*", "prompts*", "tests*"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

